# Runs every check on pull requests and pushes. A red cross on a commit or pull request
# means one of these steps failed: open the run and look for the first red step.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Colour contrast
        run: npm run check:contrast

      - name: Build
        run: npm run build

      - name: JavaScript size budget
        run: npm run check:size

      - name: Install browser for tests
        run: npx playwright install --with-deps chromium

      - name: Links and image alt text
        run: npm run check:html

      - name: Accessibility (axe) and keyboard tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
